name: "Setup and Build"
description: "Sets up Node, pnpm, installs dependencies, lints, runs tests and builds the package"

runs:
  using: "composite"
  steps:
    - uses: pnpm/action-setup@v6
    - uses: actions/setup-node@v6
      with:
        node-version: "latest"
        registry-url: "https://registry.npmjs.org"
        cache: "pnpm"
    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
    - name: Lint
      shell: bash
      run: pnpm lint
    - name: Run tests
      shell: bash
      run: pnpm test
    - name: Build package
      shell: bash
      run: pnpm build
